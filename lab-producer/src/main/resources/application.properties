server.port=8091

# Kafka broker (KRaft single broker, PLAINTEXT). Override with KAFKA_BOOTSTRAP_SERVERS.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Task 1.4: producer flow control - acks / bounded queue / retry / linger+batch / max.blocking
# all via spring.kafka.producer.properties[...] (Task: "all via spring.kafka.producer.properties").
spring.kafka.producer.properties[acks]=1
spring.kafka.producer.properties[queue.size]=1000
spring.kafka.producer.properties[max.attempts]=3
spring.kafka.producer.properties[linger.ms]=50
spring.kafka.producer.properties[batch.size]=8192
spring.kafka.producer.properties[max.blocking]=5000

# Acknowledgment lane: exactly one property selects the active mode (Task 1.3).
# The startup log names the mode and its acks value (see LabBeans bean log).
lab.producer.lane=async
lab.producer.lane.async.acks=${spring.kafka.producer.properties[acks]}
lab.producer.lane.sync.acks=all

# Throttle lane: deliberately tiny queue so /lab/throttle demonstrates 429 back-pressure.
lab.producer.throttle.buffer.bytes=65536
lab.producer.throttle.max.request.size=4096
lab.producer.throttle.linger.ms=50
lab.producer.throttle.max.block.ms=300
lab.producer.throttle.retry.after=1
lab.producer.throttle.probe.timeout=250

# Kafka Streams lane (Task 3.1 / A17): hosted inside lab-producer (D-10).
# application-id keeps every Streams topic/group in the lab-* namespace:
# group "lab-producer", changelog "lab-producer-lab-running-totals-changelog".
spring.kafka.streams.application-id=lab-producer
# Kafka Streams 4.x defaults processing.guarantee to at_least_once, whose
# commit.interval.ms default is 30s - pin a short commit so state flushes and
# offset commits stay observable in the lab.
spring.kafka.streams.properties[commit.interval.ms]=100

# Accepted reader (GET /lab/accepted): Boot Jackson deserializer + earliest reset so
# the lane output from the very first record is visible. Group id is a lab-* group.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.lab.producer.AcceptedTotal
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.lab.producer
spring.kafka.consumer.properties[auto.offset.reset]=earliest
lab.listener.accepted.group=lab-accepted-read

# Kafka transactions (txn push lane lab-ack-a/lab-ack-b). Lab-scoped key so the
# Boot auto kafkaTransactionManager bean (spring.kafka.producer.transaction-id-prefix)
# is NOT activated - the prefix is applied to the raw template bean instead.
lab.kafka.transaction-id-prefix=lab-txn-

# Topic names + partition counts from properties (never hardcoded in Java, Task 1.7/B1).
lab.topic.orders=lab-orders
lab.topic.orders.partitions=3
lab.topic.throttle=lab-throttle
lab.topic.ack.a=lab-ack-a
lab.topic.ack.b=lab-ack-b
lab.topic.pending=lab-pending
lab.topic.accepted=lab-accepted
lab.topic.avro=lab-avro
lab.topic.person=person

# AVRO lane (Task 3.2): the Confluent Schema Registry URL used by the Avro
# serializer/deserializer beans. Override with SCHEMA_REGISTRY_URL.
lab.kafka.schema-registry-url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# Diagnostics also lists sibling order-* topics for namespace contrast (Task 1.7).
lab.diagnostics.extra.topics=order-created,order-email-sent
