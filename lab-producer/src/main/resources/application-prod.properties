# =============================================================================
# lab-producer — application-prod.properties (Spring profile: prod)
# -----------------------------------------------------------------------------
# THIS BOX CANNOT SHOW ANY OF IT. The dev environment is a single-node KRaft
# broker (order-kafka2, apache/kafka:4.0.0) on PLAINTEXT with replication factor
# 1 and no authentication/authorization. Everything below is the DELTA you apply
# for a real deployment — kept here as commented guidance so the prod shape is
# documented next to the code, not lost in a wiki. None of it is exercised by the
# test gate (which uses in-process brokers) or by this dev box.
# =============================================================================

# --- Broker topology -------------------------------------------------------
# Dev: one host, PLAINTEXT. Prod: multiple brokers behind a load balancer / DNS,
# and you name at least 3 so client metadata stays correct if one is down.
# spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:broker-1:9093,broker-2:9093,broker-3:9093}

# --- Security: TLS + SASL/SCRAM -------------------------------------------
# Dev: none (PLAINTEXT). Prod: encrypt the wire and authenticate every client.
# The listener name must match the broker's advertised security listener.
# spring.kafka.producer.properties[security.protocol]=SASL_SSL
# spring.kafka.producer.properties[sasl.mechanism]=SCRAM-SHA-512
# spring.kafka.producer.properties[sasl.jaas.config]=\
#   org.apache.kafka.common.security.scram.ScramLoginModule required \
#   username="${KAFKA_SASL_USER}" password="${KAFKA_SASL_PASSWORD}";
# spring.kafka.producer.properties[ssl.truststore.location]=/etc/kafka/secrets/truststore.jks
# spring.kafka.producer.properties[ssl.truststore.password]=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
# spring.kafka.producer.properties[ssl.keystore.location]=/etc/kafka/secrets/keystore.jks
# spring.kafka.producer.properties[ssl.keystore.password]=${KAFKA_SSL_KEYSTORE_PASSWORD}

# --- Durability / replication (the "don't-lose" dial) ----------------------
# Dev: RF 1, acks=1. Prod: RF >= 3 across racks, acks=all, and require a quorum of
# replicas so an acked write survives a broker loss. These are the properties that
# turn "the leader said yes" into "a quorum has it".
# spring.kafka.producer.properties[acks]=all
# spring.kafka.producer.properties[enable.idempotence]=true
# (topic-side, set at creation / via admin, not here: replication.factor=3,
#  min.insync.replicas=2)

# --- Schema registry -------------------------------------------------------
# Dev: http://localhost:8081. Prod: a dedicated, authenticated registry cluster.
# lab.kafka.schema-registry-url=${SCHEMA_REGISTRY_URL:http://registry-1:8081,registry-2:8081}
# (kafka-avro-serializer also supports basic-auth via schema.registry.basic.auth.user.info)

# --- Producer flow control stays property-driven in prod too ---------------
# The same bounded-queue / max.block.ms back-pressure that the lab demonstrates is
# what keeps a hot producer from OOM-ing against a slow broker. Keep it explicit:
# spring.kafka.producer.properties[buffer.memory]=67108864
# spring.kafka.producer.properties[max.block.ms]=5000
