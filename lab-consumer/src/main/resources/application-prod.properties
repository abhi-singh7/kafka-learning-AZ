# =============================================================================
# lab-consumer — application-prod.properties (Spring profile: prod)
# -----------------------------------------------------------------------------
# THIS BOX CANNOT SHOW ANY OF IT. The dev environment is a single-node KRaft
# broker (order-kafka2, apache/kafka:4.0.0) on PLAINTEXT with replication factor
# 1 and no authentication/authorization. Everything below is the DELTA you apply
# for a real deployment — kept here as commented guidance so the prod shape is
# documented next to the code. None of it is exercised by the test gate (which
# uses in-process brokers) or by this dev box.
# =============================================================================

# --- Broker topology -------------------------------------------------------
# Dev: one host, PLAINTEXT. Prod: multiple brokers; name >= 3 so the consumer's
# metadata stays correct if a broker is down during a rebalance.
# spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:broker-1:9093,broker-2:9093,broker-3:9093}

# --- Security: TLS + SASL/SCRAM -------------------------------------------
# Dev: none (PLAINTEXT). Prod: encrypt the wire and authenticate every consumer.
# spring.kafka.consumer.properties[security.protocol]=SASL_SSL
# spring.kafka.consumer.properties[sasl.mechanism]=SCRAM-SHA-512
# spring.kafka.consumer.properties[sasl.jaas.config]=\
#   org.apache.kafka.common.security.scram.ScramLoginModule required \
#   username="${KAFKA_SASL_USER}" password="${KAFKA_SASL_PASSWORD}";
# spring.kafka.consumer.properties[ssl.truststore.location]=/etc/kafka/secrets/truststore.jks
# spring.kafka.consumer.properties[ssl.truststore.password]=${KAFKA_SSL_TRUSTSTORE_PASSWORD}

# --- Group / rebalance behaviour ------------------------------------------
# Dev sets GROUP_INITIAL_REBALANCE_DELAY_MS=0 so a rebalance is immediately
# observable. In prod you usually KEEP the default (3s) to reduce churn, and you
# size session/heartbeat/max.poll to match your handler's worst-case batch time:
# spring.kafka.consumer.properties[session.timeout.ms]=45000
# spring.kafka.consumer.properties[heartbeat.interval.ms]=15000
# spring.kafka.consumer.properties[max.poll.interval.ms]=300000
# spring.kafka.consumer.properties[max.poll.records]=200

# --- The ack dial is the loss window (see docs/glossary.md) ---------------
# Dev default is after-processed. In prod, choose the commit point deliberately and
# make the handler idempotent (dedup on orderId / transactional side effects),
# because at-least-once redelivery is guaranteed across rebalance and restart:
# lab.ack.strategy=after-processed

# --- Schema registry -------------------------------------------------------
# Dev: http://localhost:8081. Prod: a dedicated, authenticated registry cluster.
# lab.kafka.schema-registry-url=${SCHEMA_REGISTRY_URL:http://registry-1:8081,registry-2:8081}
