server.port=8092

# Kafka broker (KRaft single broker, PLAINTEXT). Override with KAFKA_BOOTSTRAP_SERVERS.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer groups + topic names from properties (never hardcoded in Java, spec gate).
lab.group.main=lab-consumer
lab.group.competitor=lab-competitor
lab.group.txn=lab-txn
lab.group.avro=lab-avro-read
lab.topic.orders=lab-orders
lab.topic.rebalance=lab-rebalance
lab.topic.rejected=lab-rejected
lab.topic.ack.a=lab-ack-a
lab.topic.ack.b=lab-ack-b
lab.topic.person=person

# Task 2.1: cold-start option — process the backlog (earliest) or skip.records (latest).
# The active option is logged at startup.
lab.consumer.startup=process

# Task 2.3: acknowledgment dial — immediate | after-processed (default) | batch.
lab.ack.strategy=after-processed
lab.ack.batch-size=5

# Task 2.6: bounded retry with exponential backoff, then quarantine to lab-rejected.
lab.retry.max-attempts=3
lab.retry.backoff.base.ms=100

# Task 2.8: rollback mode for the transactional lane — retry-next-poll | discard.
lab.rollback.mode=retry-next-poll

# Consumer-side transaction id prefix (lab-scoped key on purpose: the Boot auto
# kafkaTransactionManager bean is NOT activated; the prefix goes on our factory).
lab.kafka.transaction-id-prefix=lab-txn-c-

# AVRO lane (Task 3.2): read OrderEvent from lab-avro via the Confluent Avro deserializer
# against the schema registry. Override with SCHEMA_REGISTRY_URL.
lab.topic.avro=lab-avro
lab.kafka.schema-registry-url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
