# Topology documentation for the Kafka Order Event Services.
#
# The test gate uses in-process KRaft brokers (spring-kafka-test) and does NOT
# depend on this file. In local dev, the broker is already running as container
# `order-kafka2` (apache/kafka:4.0.0, KRaft) at localhost:9092. This compose
# file documents the intended topology: one single-node KRaft broker exposing
# four topics.
#
# NOTE (kafka-lab-pair): this broker is REUSED as-is by the lab-producer /
# lab-consumer learning pair (see /docs). It only ever touches its own lab-*
# topics and consumer groups, so nothing in this file changes for that work.
# DO NOT run `docker compose up` while doing lab work — it would recreate
# order-kafka2 and wipe the broker state. The broker is already running.
#
#   DOCKER_SOCKET=/home/abhi/.docker/desktop/backend.sock

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: order-kafka2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # single partition, replication factor 1 (matches the measured layout)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # The four topics (created explicitly in dev; documented here for the topology).
    #   order-created     ← produced by order-service (key = orderId)
    #   order-email-sent  ← ack from email-service
    #   order-persisted   ← ack from order-persistence-service
    #   order-failed      ← poison sink (raw payload + reason)
